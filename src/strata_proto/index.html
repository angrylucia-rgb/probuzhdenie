<title>Пласты камня — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=PT+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Раскладка: стена на весь экран (WebGL), слева — полевой журнал геолога, справа — керн из 20 пластов. Один тёмный мир (подземелье), без светлой темы — сознательно. */
:root{
  --ink:#0b0907;          /* темнота породы */
  --paper:#e9dfcb;        /* текст журнала */
  --muted:#a89a82;        /* подписи */
  --lamp:#f2c879;         /* тёплый свет фонаря — единственный акцент */
  --line:rgba(233,223,203,.16);
  --veil:rgba(8,6,5,.78);
  --f-disp:"Forum","Cormorant Garamond",Georgia,serif;
  --f-body:"PT Serif",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;touch-action:none}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.ui{position:fixed;inset:0;pointer-events:none}
.ui *{pointer-events:auto}
/* журнал */
.log{position:absolute;left:0;top:0;bottom:0;width:min(400px,34vw);padding:calc(env(safe-area-inset-top,0px) + 34px) 30px 28px 32px;
  background:linear-gradient(90deg,var(--veil) 0,var(--veil) 70%,rgba(8,6,5,0));display:flex;flex-direction:column;gap:14px;pointer-events:none}
.log>*{pointer-events:auto}
.eyebrow{font:500 11px/1.4 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--lamp)}
.eyebrow span{color:var(--muted)}
h1{font:400 clamp(38px,4.2vw,58px)/1 var(--f-disp);margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.age{font:400 15px/1.3 var(--f-mono);color:var(--lamp);font-variant-numeric:tabular-nums}
.rock{font:italic 16px/1.45 var(--f-body);color:var(--muted);margin:0}
.txt{font:16px/1.55 var(--f-body);margin:0;max-width:62ch}
.mk{font-style:normal;color:var(--lamp);font-size:.85em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
button{font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:rgba(20,16,12,.7);
  border:1px solid rgba(242,200,121,.45);border-radius:999px;padding:11px 16px;cursor:pointer;transition:background .25s,border-color .25s,color .25s}
button:hover{background:rgba(242,200,121,.14);border-color:var(--lamp)}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
button.go{color:#1a1208;background:var(--lamp);border-color:var(--lamp)}
button.go:hover{background:#ffd994}
button:disabled,button.go:disabled{opacity:.45;cursor:default;background:rgba(20,16,12,.7);color:var(--muted);border-color:rgba(242,200,121,.3)}
.nav{display:flex;gap:8px}
.nav button{width:40px;height:40px;padding:0;font-size:16px;letter-spacing:0}
.way[hidden]{display:none}
.way{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:400 12px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.way .wl{width:100%;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.way label{display:flex;gap:6px;align-items:center;cursor:pointer}
.way input{accent-color:var(--lamp);margin:0}
.tip{margin-top:auto;font:400 12px/1.5 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.tip b{color:var(--paper);font-weight:500}
/* керн */
.core{position:absolute;right:22px;top:calc(env(safe-area-inset-top,0px) + 50px);bottom:28px;width:30px;display:flex;flex-direction:column;gap:3px}
.seg{flex:1;border-radius:3px;background:#17130f;border:1px solid rgba(233,223,203,.07);position:relative;cursor:default;background-size:cover;background-position:center}
.seg.ready{cursor:pointer;border-color:rgba(233,223,203,.25)}
.seg.ready:hover{border-color:var(--lamp)}
.seg.cur{outline:2px solid var(--lamp);outline-offset:2px}
.seg .nm{position:absolute;right:42px;top:50%;transform:translateY(-50%);white-space:nowrap;font:400 18px/1 var(--f-disp);color:var(--paper);opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 1px 6px #000}
.seg.cur .nm,.seg:hover .nm{opacity:1}
.seg:not(.ready) .nm{font:400 11px/1 var(--f-mono);color:var(--muted)}
.coreCap{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 22px);font:500 10px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
/* метки на стене */
.pin{position:absolute;right:70px;font:400 11px/1.3 var(--f-mono);color:var(--paper);letter-spacing:.06em;display:flex;align-items:center;gap:8px;pointer-events:none;opacity:.85;text-shadow:0 1px 4px #000;transition:opacity .3s}
.pin::after{content:"";width:46px;height:1px;background:var(--lamp)}
.gap{position:absolute;left:min(430px,37vw);font:400 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.06em;pointer-events:none;text-shadow:0 1px 4px #000}
.hov{position:absolute;font:400 13px/1.35 var(--f-mono);color:var(--paper);background:rgba(8,6,5,.82);border:1px solid rgba(242,200,121,.5);padding:8px 11px;border-radius:6px;pointer-events:none;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .2s}
.hov b{color:var(--lamp);font-weight:500}
.load{position:fixed;inset:0;display:grid;place-items:center;font:400 13px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:var(--ink);transition:opacity .8s}
@media (max-width:720px){
  .log{width:auto;left:0;right:0;top:auto;bottom:0;padding:16px 64px calc(env(safe-area-inset-bottom,0px) + 16px) 16px;gap:8px;
    background:linear-gradient(0deg,var(--veil) 0,var(--veil) 75%,rgba(8,6,5,0))}
  h1{font-size:34px}
  .txt{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .rock{font-size:14px}
  .tip{display:none}
  .way .wl{display:none}
  .core{right:12px;width:22px}
  .coreCap{right:8px}
  .pin{right:44px}.pin::after{width:20px}
  .gap{left:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="gl" aria-label="Стена породы под фонарём"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="ui">
  <section class="log" id="log">
    <div class="eyebrow">Биосфера · пласты камня <span>· прототип</span></div>
    <h1 id="nm">Наше время</h1>
    <div class="age" id="age"></div>
    <p class="rock" id="rock"></p>
    <p class="txt" id="txt"></p>
    <div class="row">
      <div class="nav"><button id="up" aria-label="Пласт выше">↑</button><button id="dn" aria-label="Пласт ниже">↓</button></div>
      <button class="go" id="act" hidden>Оживить окаменелость</button>
    </div>
    <div class="way" id="way" role="radiogroup" aria-label="Как открыть камень">
      <span class="wl">как открыть камень</span>
      <label><input type="radio" name="way" id="waySlab" value="slab" checked> расколоть по слоям</label>
      <label><input type="radio" name="way" id="wayErode" value="erode"> стереть временем</label>
    </div>
    <div class="tip">Курсор — это <b>фонарь</b>: ведите им по стене.<br>Колесо или ↑ ↓ — спуск по пластам.</div>
  </section>
  <div class="coreCap">керн</div>
  <div class="core" id="core"></div>
  <div class="hov" id="hov"></div>
  <div id="pins"></div>
</div>
<div class="load" id="load">спускаемся в породу…</div>
